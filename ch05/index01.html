<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>속성 연습</title>
</head>
<body>
  <!-- id 속성 : 요소를 고유하게 식별 (한 페이지에 값은 유일해야 한다) -->
  <h1 id = "main-title">HTML 속성 배우기</h1>

  <!-- class 속성 : 여러 요소에 공통 스타일을 적용할 때 많이 사용한다. -->
  <p>이것은 첫 번째 문단 입니다</p>
  <p>이것은 두 번째 문단 입니다</p>

  <!-- src, alt 속성 : 이미지 삽입 시 필수 -->
  <img src="../ch02/a.png" alt="샘플 이미지"><br>

  <!-- href 속성 : 링크 연결 -->
  <a href="http://www.naver.com/" target="_blank">우리 회사 사이트 방문</a><br>
  <a href="http://www.naver.com/" target="_self">우리 회사 사이트 방문</a><br>

  <!-- style 속성 : 인라인 css 스타일 적용 -->
  <div style="color: blue; font-size: 22px;">스타일 속성 테스트</div>

  <!-- data- 속성 : 사용자 정의 속성 -->
  <button data-type="mybutton" onclick="alert('클릭됨')">버튼</button>
</body>
</html>
